<style>

:root[data-theme="dark"]{--bg:#141516;--fg:#e8e8e8;--muted:#a0a4aa;--line:#33363a;--accent:#7aa7ff;--soft:#1d1f21;--warn:#e7b85c;--c1:#7aa7ff;--c2:#f0975a;--c3:#6fd197;--c4:#c39cf0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px}
h1{font-size:1.7rem;margin:0 0 6px;line-height:1.2;text-wrap:balance}
h2{font-size:1.1rem;margin:28px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--bg);padding:7px 14px;border-radius:5px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.settings{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:16px 0 4px;font-size:.92rem}
.settings input[type=text]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:120px}
.settings label{display:inline-flex;gap:6px;align-items:center}
ul.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.tasks li{border-bottom:1px solid var(--line)}
ul.tasks button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;padding:11px 4px}
ul.tasks button:hover{background:var(--soft)}
.tname{font-weight:600}
.tsub{grid-column:1;color:var(--muted);font-size:.88rem}
.tside{grid-row:1/span 2;grid-column:2;align-self:center;color:var(--muted);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums}
.done{color:var(--c3)}
ol.steps{padding-left:1.3em;margin:0 0 12px}
ol.steps li{margin-bottom:5px}

.tablewrap{overflow-x:auto}

.warn{color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.chart svg{width:100%;max-width:600px;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:0}

.notes{margin-top:30px;font-size:.88rem;color:var(--muted)}

#v-run{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#000;color:#fff;font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

@media (max-width:600px){
 .tablewrap thead{display:none}

 .tablewrap td{border:0;padding:0}
 .tablewrap td.num{text-align:right}
 .tablewrap td.muted{grid-column:1/-1;font-size:.85rem}
 .tablewrap td.muted:empty{display:none}
}

@media (orientation:portrait){body.phone.running #rotate{display:flex}}

<main class="wrap">
  <section id="v-menu">

    <div id="device"></div>

<script>
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const S={quick:false,pid:''};
const Q=(f,q)=>S.quick?q:f;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fin=a=>a.filter(Number.isFinite);
const mean=a=>{a=fin(a);return a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN};
const sdv=a=>{a=fin(a);if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const r0=x=>Number.isFinite(x)?Math.round(x):null;
const fms=x=>Number.isFinite(x)?Math.round(x)+' ms':'–';
const fsg=x=>Number.isFinite(x)?(Math.round(x)>0?'+':Math.round(x)<0?'−':'')+Math.abs(Math.round(x))+' ms':'–';
const fpc=x=>Number.isFinite(x)?Math.round(x*100)+'%':'–';
const fpts=x=>Number.isFinite(x)?(Math.round(x*100)>0?'+':Math.round(x*100)<0?'−':'')+Math.abs(Math.round(x*100))+' pts':'–';
const f1=(x,u='')=>Number.isFinite(x)?(Math.round(x*10)/10).toFixed(1).replace('-','−')+u:'–';
const f2=x=>Number.isFinite(x)?x.toFixed(2).replace('-','−'):'–';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function slope(xs,ys){const p=xs.map((x,i)=>[x,ys[i]]).filter(([x,y])=>Number.isFinite(x)&&Number.isFinite(y));if(p.length<2)return NaN;const mx=mean(p.map(q=>q[0])),my=mean(p.map(q=>q[1]));let n=0,d=0;for(const[x,y]of p){n+=(x-mx)*(y-my);d+=(x-mx)**2}return d?n/d:NaN}
function probit(p){const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],c=[-.007784894002430293,-.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],d=[.007784695709041462,.3224671290700398,2.445134137142996,3.754408661907416],pl=.02425;let q,r;if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}q=p-.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)}
function rareSeq(n,counts,lead){for(;;){const s=Array(n).fill(0);let ok=true;for(const[val,k]of counts){let c=0,g=0;while(c<k&&g<50000){g++;const i=ri(lead,n-1);if(!s[i]&&!s[i-1]&&!s[i+1]){s[i]=val;c++}}if(c<k){ok=false;break}}if(ok)return s}}

/* ---------- engine: frames, timers, responses, abort ---------- */
class Stop extends Error{}
const R={running:false,aborted:false,pending:new Set(),presses:[],waiter:null,keyHook:null,onInput:null,abortP:null,abortRej:null};
const nowOf=e=>{const t=e&&e.timeStamp;return(t&&t>0&&t<performance.now()+1e5)?t:performance.now()};

function frame(){check();return new Promise((res,rej)=>{const o={rej,raf:1};o.id=requestAnimationFrame(ts=>{R.pending.delete(o);res(ts)});R.pending.add(o)})}
async function showAt(t,fn){let ts;do{ts=await frame()}while(ts<t-8);if(fn)fn();return ts}
const show=fn=>showAt(0,fn);
async function until(t,tick){while(performance.now()<t-6){await frame();if(tick)tick()}}
function race(p){return Promise.race([p,R.abortP])}
function waitKey(keys,timeout,t0){check();const base=t0??performance.now();return new Promise((res,rej)=>{let to=null;const done=()=>{if(to)clearTimeout(to);R.waiter=null};R.waiter={keys,res:(k,t)=>{done();res({key:k,rt:t-base,t})},rej:e=>{done();rej(e)}};if(timeout!=null)to=setTimeout(()=>{done();res({key:null,rt:null,t:null})},Math.max(0,timeout-(performance.now()-base)))})}

document.addEventListener('keydown',e=>{if(!R.running)return;if(e.key==='Escape'){stopTask();return}if(e.repeat)return;let k=e.key.length===1?e.key.toLowerCase():e.key;if(k===' ')k='space';if(k==='space'||k==='Enter'||k==='Backspace'||k==='Tab')e.preventDefault();input(k,nowOf(e))});
$('#pad').addEventListener('pointerdown',e=>{const b=e.target.closest('.pk');if(!b)return;e.preventDefault();b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),120);input(b.dataset.key,nowOf(e))});

function setPad(btns){const p=$('#pad');p.innerHTML='';for(const b of btns){const el=document.createElement('button');el.type='button';el.tabIndex=-1;el.className='pk'+(b.wide?' wide':'')+(b.sm?' sm':'');el.dataset.key=b.key;el.innerHTML=`<span>${b.label}</span>${b.sub?`<span class="ps">${b.sub}</span>`:''}`;if(b.color){el.style.setProperty('--pk',b.color);el.classList.add('col')}p.append(el)}}
function progress(i,n,extra=''){$('#run-prog').textContent=`${extra?extra+' · ':''}${Math.min(i+1,n)} / ${n}`}

/* ---------- canvas ---------- */
const cv=$('#stage'),cx=cv.getContext('2d');let W=0,H=0,U=0;
const SC={bg:'#000000',ink:'#ffffff',dim:'#8a8a8a'};
const FONT="Helvetica, Arial, sans-serif";
function setStage(bg,ink,dim){SC.bg=bg;SC.ink=ink;SC.dim=dim;const v=$('#v-run');v.style.background=bg;v.style.color=ink}
function sizeCanvas(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));cx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height;U=Math.min(W,H)}
window.addEventListener('resize',()=>{if(R.running)sizeCanvas()});
function clear(){cx.fillStyle=SC.bg;cx.fillRect(0,0,W,H)}
const TU=()=>Math.max(U,400);
function txt(s,{size=.1,color=SC.ink,x=W/2,y=H/2,weight=700,maxW=W*.92}={}){let px=Math.max(size*TU(),14);cx.font=`${weight} ${px}px ${FONT}`;const w=cx.measureText(s).width;if(w>maxW){px*=maxW/w;cx.font=`${weight} ${px}px ${FONT}`}cx.fillStyle=color;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(s,x,y)}
const PHONE_TXT={
'Press Space as soon as you see the target. On a few trials there is no target. Do not press on those.':'Tap the button as soon as you see the target. On a few trials there is no target. Do not tap on those.',
'Use D for red, F for green, J for blue and K for yellow.':'Tap the button with the matching colour.',
'Press Space for every digit except 3.':'Tap the button for every digit except 3.',
'When a 3 appears, do not press.':'When a 3 appears, do not tap.',
'Press J if the target is there and F if it is not.':'Tap Present or Absent.',
'Report block: after each stream, type the white letter, then say whether there was an X.':'Report block: after each stream, tap the white letter, then say whether there was an X.',
'Listen to three digits, then type them in order and press Enter.':'Listen to three digits in noise, then tap them in order and tap Submit.',
'Judge the pitch of the voice: F for low, J for high.':'Judge the pitch of the voice: tap Low voice or High voice.',
'Press F if the digit is odd and J if it is even.':'Tap Odd or Even.',
'Press Space for each slightly higher beep in that ear.':'Tap the button for each slightly higher beep in that ear.',
'Click the answer, or type it and press Enter.':'Tap the answer.',
'Press Space when the target appears':'Tap when the target appears',
'D red · F green · J blue · K yellow':'Tap the matching colour',
'Practice: press Space for every digit except 3':'Practice: tap for every digit except 3',
'Y = yes · N = no':'Tap X seen or No X',
'Enter to submit':'Tap Submit',
'Type the three digits':'Tap the three digits',
'Type the three digits you hear':'Tap the three digits you hear',
'F low · J high':'Tap Low voice or High voice',
'Odd / even: F odd · J even':'Odd or even? Tap the button',
'Press Space for higher beeps in that ear only':'Tap for higher beeps in that ear only',
'J present · F absent':'Tap Present or Absent',
'After each stream: type the white letter, then Y/N for the X':'After each stream: tap the white letter, then say if there was an X',
'After each stream: Y if there was an X, N if not':'After each stream: say whether there was an X'};
const tx=t=>S.device==='phone'&&PHONE_TXT[t]||t;
function lines(arr){const L=arr.map(l=>typeof l==='string'?{t:tx(l)}:{...l,t:tx(l.t)});const hs=L.map(l=>Math.max((l.size||.05)*TU(),15)*1.6);let y=H/2-hs.reduce((a,b)=>a+b,0)/2;L.forEach((l,i)=>{y+=hs[i]/2;txt(l.t,{size:l.size||.05,color:l.color||SC.ink,weight:l.weight||400,y});y+=hs[i]/2})}

function blankFix(){clear();fixation()}
async function note(msg,ms=500){await show(()=>{clear();txt(msg,{size:.05,weight:400})});await wait(ms)}
async function screen(arr,btn='Continue'){const keep=$('#pad').innerHTML;setPad([{key:'space',label:btn,sub:'Space',wide:true}]);await show(()=>{clear();lines(arr)});await waitKey(['space','Enter'],null);$('#pad').innerHTML=keep;await show(clear);await wait(400)}

/* ---------- audio ---------- */

function loadVoices(){return new Promise(res=>{if(!('speechSynthesis' in window))return res(null);const choose=()=>{const vs=speechSynthesis.getVoices();if(!vs.length)return null;return vs.find(v=>/en[-_]GB/i.test(v.lang)&&v.localService)||vs.find(v=>/^en/i.test(v.lang)&&v.localService)||vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||vs[0]};const v=choose();if(v){VOICE=v;return res(v)}speechSynthesis.addEventListener('voiceschanged',()=>{const c=choose();if(c){VOICE=c;res(c)}},{once:true});setTimeout(()=>{VOICE=choose();res(VOICE)},1500)})}

  return data},
 summarize(d){const paces=[...new Set(d.map(x=>x.pace_s))];const pc=p=>d.filter(x=>x.pace_s===p);
  return{headline:paces.map(p=>`${pc(p).filter(x=>x.correct).length}/${pc(p).length}`).join(', '),rows:paces.map(p=>{const r=pc(p);let dy=0;for(let i=1;i<r.length;i++)if(r[i].correct&&r[i-1].correct)dy++;return[`Correct at ${p} s`,`${r.filter(x=>x.correct).length} of ${r.length}`,`${fpc(mean(r.map(x=>x.correct)))}; ${r.filter(x=>x.answer==null).length} missed; ${dy} dyads`]}).concat([['Total correct',`${d.filter(x=>x.correct).length} of ${d.length}`,'']]),
   chart:{type:'bar',unit:'Correct (%)',yMax:100,items:paces.map((p,i)=>({label:`${p} s`,value:mean(pc(p).map(x=>x.correct))*100,color:['var(--c1)','var(--c3)','var(--c4)','var(--c2)'][i]}))},
   read:'Scores usually drop as the pace gets faster. “Dyads” count two correct answers in a row.'}}}
};
function dinLevel(snr){return Math.min(.6,.06*Math.pow(10,-snr/20))}
const ORDER={vis:['posner','stroop','sart','search','blink'],aud:['din','astroop','distract','dichotic','pasat']};

/* ---------- storage ---------- */
const KEY='attentionBattery.v2';let RESULTS={};
try{S.device=localStorage.getItem(KEY+'.device')||''}catch(e){S.device=''}
function setDevice(d){S.device=d;try{localStorage.setItem(KEY+'.device',d)}catch(e){}document.body.classList.toggle('phone',d==='phone');renderDevice();renderMenu()}
function renderDevice(){const el=$('#device');$('#lists').hidden=!S.device;document.body.classList.toggle('phone',S.device==='phone');
  if(!S.device){el.innerHTML='<div class="device"><strong>What are you using?</strong><div class="row"><button type="button" class="btn" id="d-desk">Laptop or computer with keyboard</button><button type="button" class="btn" id="d-phone">Phone or tablet</button></div></div>';$('#d-desk').onclick=()=>setDevice('desktop');$('#d-phone').onclick=()=>setDevice('phone')}
  else{el.innerHTML=`<p class="small muted">Using: ${S.device==='phone'?'phone or tablet (tap the on-screen buttons; turn it sideways for each task)':'laptop or computer with keyboard'} · <button type="button" class="link" id="d-change">Change</button></p>`;$('#d-change').onclick=()=>setDevice('')}}
try{RESULTS=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){RESULTS={}}
function saveResults(){try{localStorage.setItem(KEY,JSON.stringify(RESULTS))}catch(e){}}

/* ---------- views ---------- */
function view(id){for(const v of['v-menu','v-instr','v-result'])$('#'+v).hidden=v!==id;$('#v-run').hidden=id!=='v-run';if(id!=='v-run')window.scrollTo(0,0)}
const minsOf=T=>`~${T.mins[0]} min`;
const quickOf=T=>`~${T.mins[1]} min`;
function renderMenu(){for(const mod of['vis','aud']){const ul=$('#list-'+mod);ul.innerHTML='';for(const id of ORDER[mod]){const T=TASKS[id],res=RESULTS[id];let sum=null;if(res){try{sum=T.summarize(res.data)}catch(e){}}
  const li=document.createElement('li');li.innerHTML=`<button type="button"><span class="tname">${esc(T.name)}</span><span class="tside">${minsOf(T)} · quick ${quickOf(T)}${T.hp?'<br>headphones':''}</span>${sum?'<span class="tsub"><span class="done">Completed</span></span>':''}</button>`;
  li.querySelector('button').onclick=()=>openTask(id);ul.append(li)}}}

function openTask(id){const T=TASKS[id],el=$('#v-instr');const ok=!T.speech||('speechSynthesis' in window);
  el.innerHTML=`<p><button type="button" class="link" id="i-back">← All tasks</button></p>
  <h1>${esc(T.name)}</h1><p class="muted">${esc(T.mech)} · full ${minsOf(T)}, quick demo ${quickOf(T)}</p>
  <p>${esc(T.about)}</p>
  <h2>Instructions</h2><ol class="steps">${T.steps.map(s=>`<li>${esc(tx(s))}</li>`).join('')}</ol>
  ${S.device==='phone'?'<p>Respond by tapping the buttons at the bottom of the screen. Turn your phone or tablet sideways when the task starts.</p>':`<p>${T.keys.map(([k,l])=>`<kbd>${esc(k)}</kbd> ${esc(l)}`).join(' &nbsp; ')}</p>`}
  ${T.hp?`<p class="warn">${esc(T.hp)}.</p>`:''}
  ${S.device==='phone'&&T.mod==='aud'?'<p class="warn">Turn off silent mode and turn the volume up.</p>':''}
  ${S.device==='phone'&&id==='distract'?'<p class="warn">Use wired headphones or the phone speaker, not Bluetooth earbuds. Bluetooth delays the sound, which changes the sound-to-digit timing this task depends on.</p>':''}
  ${T.checks?`<div class="row"><span class="muted small">Sound check:</span>${T.checks.map((c,i)=>`<button type="button" class="btn" data-check="${i}">${esc(c.label)}</button>`).join('')}</div>${T.speech?'<p class="muted small" id="voice-name"></p>':''}`:''}
  ${ok?'':'<p class="warn">This browser has no built-in speech voice, so this task cannot run here. Try Chrome, Edge or Safari.</p>'}
  <div class="row"><button type="button" class="btn primary" id="i-start" ${ok?'':'disabled'}>Start full task (${minsOf(T)})</button><button type="button" class="btn" id="i-quick" ${ok?'':'disabled'}>Start quick demo (${quickOf(T)})</button><span class="muted small">${S.device==='phone'?'Tap Stop at the top of the screen to end a task early.':'Esc stops the task at any point.'}</span></div>
  <h2>Method</h2><ul class="small">${T.method.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`;
  view('v-instr');$('#i-back').onclick=()=>{renderMenu();view('v-menu')};$('#i-start').onclick=()=>{S.quick=false;runTask(id)};$('#i-quick').onclick=()=>{S.quick=true;runTask(id)};
  el.querySelectorAll('[data-check]').forEach(b=>b.onclick=async()=>{try{await T.checks[+b.dataset.check].fn()}catch(e){}const v=$('#voice-name');if(v&&VOICE)v.textContent=`Voice: ${VOICE.name}`});
  if(T.speech&&'speechSynthesis' in window)loadVoices().then(v=>{const n=$('#voice-name');if(n&&v)n.textContent=`Voice: ${v.name}`})}

async function runTask(id){const T=TASKS[id];
  R.running=true;R.aborted=false;R.pending.clear();R.presses=[];R.waiter=null;R.keyHook=null;R.onInput=null;R.abortP=new Promise((_,rej)=>R.abortRej=rej);R.abortP.catch(()=>{});
  try{if(T.mod==='aud')initAudio()}catch(e){}
  $('#run-name').textContent=T.name;$('#run-stop').textContent=S.device==='phone'?'Stop':'Stop (Esc)';$('#run-prog').textContent='';$('#pad').innerHTML='';setStage('#000000','#ffffff','#8a8a8a');view('v-run');document.body.classList.add('running');
  let wl=null;try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}
  if(S.device==='phone'){while(window.innerHeight>window.innerWidth&&!R.aborted){await new Promise(r=>{const h=()=>{window.removeEventListener('resize',h);r()};window.addEventListener('resize',h);setTimeout(h,500)})}}
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));sizeCanvas();clear();R.wl=wl;
  try{const data=await T.run();R.running=false;RESULTS[id]={data,mode:S.quick?'quick':'full',device:S.device||'',pid:S.pid,at:new Date().toISOString()};saveResults();showResult(id)}
  catch(e){R.running=false;try{speechSynthesis.cancel()}catch(x){}resetMaster();openTask(id);if(!(e instanceof Stop)){const w=document.createElement('p');w.className='warn';w.textContent='The task stopped: '+(e&&e.message||e);$('#v-instr').prepend(w)}}
  finally{R.running=false;R.keyHook=null;R.onInput=null;document.body.classList.remove('running');try{R.wl&&R.wl.release()}catch(e){}R.wl=null}}

/* ---------- chart ---------- */
function niceStep(range,n){const raw=range/n||1,mag=10**Math.floor(Math.log10(raw)),r=raw/mag;return(r<1.5?1:r<3?2:r<7?5:10)*mag}
function chartSVG(c){const W=Math.round(Math.max(340,Math.min(600,($('.wrap').clientWidth||600)-32))),H=270,pl=56,pr=16,pt=16,pb=c.type==='line'?54:40,iw=W-pl-pr,ih=H-pt-pb;
  const vals=fin(c.type==='bar'?c.items.map(i=>i.value):c.series.flatMap(s=>s.values));if(!vals.length)return'<p class="muted">Not enough data for a chart.</p>';
  let lo=c.yMin??(c.type==='bar'?0:Math.min(...vals)),hi=c.yMax??Math.max(...vals);if(hi-lo<1e-9)hi=lo+1;const step=niceStep(hi-lo,4);
  if(c.yMin==null&&c.type!=='bar')lo=Math.floor(lo/step)*step-(Math.floor(lo/step)*step===Math.min(...vals)?step:0);if(c.yMax==null)hi=Math.ceil(hi/step)*step;if(hi<=lo)hi=lo+step;
  const y=v=>pt+ih-(v-lo)/(hi-lo)*ih;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.unit)}">`;
  for(let v=lo;v<=hi+1e-9;v+=step){const yy=y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/><text x="${pl-8}" y="${yy}" text-anchor="end" dominant-baseline="middle" style="fill:var(--muted);font-size:12px">${Math.round(v*10)/10}</text>`}
  s+=`<text x="13" y="${pt+ih/2}" transform="rotate(-90 13 ${pt+ih/2})" text-anchor="middle" style="fill:var(--muted);font-size:12px">${esc(c.unit)}</text>`;
  if(c.type==='bar'){const n=c.items.length,slot=iw/n,bw=Math.min(70,slot*.5);c.items.forEach((it,i)=>{const x=pl+slot*(i+.5);if(Number.isFinite(it.value)){const y0=y(Math.max(lo,0)),y1=y(it.value);s+=`<rect x="${x-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.abs(y0-y1)}" style="fill:${it.color}"/><text x="${x}" y="${y1-6}" text-anchor="middle" style="fill:var(--fg);font-size:12px">${Math.round(it.value)}</text>`}s+=`<text x="${x}" y="${H-pb+18}" text-anchor="middle" style="fill:var(--fg);font-size:13px">${esc(it.label)}</text>`})}
  else{const n=c.xs.length,x=i=>n===1?pl+iw/2:pl+22+i*(iw-44)/(n-1);const every=n>12?Math.ceil(n/12):1;c.xs.forEach((l,i)=>{if(i%every===0||i===n-1)s+=`<text x="${x(i)}" y="${H-pb+17}" text-anchor="middle" style="fill:var(--muted);font-size:12px">${esc(l)}</text>`});
   s+=`<text x="${pl+iw/2}" y="${H-8}" text-anchor="middle" style="fill:var(--muted);font-size:12px">${esc(c.xLabel||'')}</text>`;
   for(const se of c.series){let p='',pen=false;se.values.forEach((v,i)=>{if(Number.isFinite(v)){p+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true}else pen=false});s+=`<path d="${p}" fill="none" style="stroke:${se.color}" stroke-width="2"/>`;
    se.values.forEach((v,i)=>{if(!Number.isFinite(v))return;const open=c.marks&&c.marks[i]===0;s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${n>16?3.5:4.5}" style="fill:${open?'var(--bg)':se.color};stroke:${se.color}" stroke-width="2"/>`})}}
  if(c.ref&&Number.isFinite(c.ref.value)){const yy=y(c.ref.value);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" style="stroke:var(--c2)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-pr}" y="${yy-6}" text-anchor="end" style="fill:var(--c2);font-size:12px">${esc(c.ref.label)} ${f1(c.ref.value,' dB')}</text>`}
  return s+'</svg>'+(c.type==='line'&&c.series.length>1?`<div class="legend">${c.series.map(se=>`<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>`:'')}

/* ---------- results + CSV ---------- */
function toCSV(ids){const rows=[];for(const id of ids){const r=RESULTS[id];if(!r)continue;r.data.forEach((d,i)=>rows.push({task:id,mode:r.mode,device:r.device||'',completed:r.at,row:i+1,...d}))}
  if(!rows.length)return'';const cols=[];for(const r of rows)for(const k of Object.keys(r))if(!cols.includes(k))cols.push(k);
  const q=v=>v==null?'':/[",\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:String(v);return[cols.join(','),...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\n')}
function copyCSV(text,btn,area){const o=btn.textContent;if(!text){btn.textContent='No data yet';setTimeout(()=>btn.textContent=o,1600);return}
  const fb=()=>{area.hidden=false;area.value=text;area.focus();area.select();btn.textContent='Select all and copy below';setTimeout(()=>btn.textContent=o,2500)};
  try{navigator.clipboard.writeText(text).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1600)},fb)}catch(e){fb()}}


const KEYFX={posner:'Key effect: benefit and cost of the arrow',stroop:'Key effect: Stroop interference',sart:'Key effect: presses to the 3',search:'Key effect: search time and number of letters',blink:'Key effect: the attentional blink',din:'Key effect: your threshold in noise',astroop:'Key effect: auditory Stroop interference',distract:'Key effect: slowing after unusual sounds',dichotic:'Key effect: listening to one ear',pasat:'Key effect: score as the pace gets faster'};
function showResult(id){const T=TASKS[id],r=RESULTS[id],s=T.summarize(r.data),el=$('#v-result');const csv=toCSV([id]);
  el.innerHTML=`<p><button type="button" class="link" id="r-back">← All tasks</button></p>
  <h1>${esc(T.name)}: results</h1><p class="muted">${r.mode==='quick'?'Quick demo':'Full length'}${r.pid?' · '+esc(r.pid):''}</p>
  <h2>${esc(KEYFX[id])}</h2>
  <div class="chart">${chartSVG(s.chart)}</div>
  <h2>Measures</h2>
  <div class="tablewrap"><table><thead><tr><th>Measure</th><th>Value</th><th>Note</th></tr></thead><tbody>${s.rows.map(([a,b,c])=>`<tr><td>${esc(a)}</td><td class="num">${esc(b)}</td><td class="muted">${esc(c)}</td></tr>`).join('')}</tbody></table></div>
  <p style="margin-top:14px">${esc(s.read)}</p>
  <div class="row"><button type="button" class="btn primary" id="r-menu">Back to tasks</button><button type="button" class="btn" id="r-again">Run again</button><button type="button" class="btn" id="r-copy">Copy data (CSV)</button></div>
  <textarea class="dump" id="r-dump" hidden readonly aria-label="Task data as CSV"></textarea>
  <details><summary>Trial data (${r.data.length} rows)</summary><textarea class="dump" readonly aria-label="Trial data" style="margin-top:8px">${esc(csv)}</textarea></details>`;
  view('v-result');$('#r-back').onclick=$('#r-menu').onclick=()=>{renderMenu();view('v-menu')};$('#r-again').onclick=()=>openTask(id);$('#r-copy').onclick=()=>copyCSV(csv,$('#r-copy'),$('#r-dump'))}

renderDevice();renderMenu();
</script>

</body></html>
